<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Wali - Les Alfadhl</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
:root{--hijau-tua:#2D5F3F;--hijau:#3E7B54;--hijau-muda:#7BAE7F;--krem:#F5EFE0;--krem-tua:#EADFC4;--putih:#FAFAF7;--teks:#2C3E2E;--emas:#C9A961;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:var(--putih);color:var(--teks);line-height:1.6;min-height:100vh;padding:20px;}
.wrap{max-width:900px;margin:0 auto;}

.topbar{
  background:linear-gradient(135deg,var(--hijau-tua),var(--hijau));
  color:#fff;padding:16px 24px;border-radius:20px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
  margin-bottom:20px;box-shadow:0 8px 24px rgba(45,95,63,.2);
}
.topbar .brand-area{display:flex;align-items:center;gap:12px;}
.topbar .brand-area img{
  height:48px;width:48px;object-fit:cover;border-radius:50%;
  background:#fff;padding:3px;border:2px solid var(--emas);
}
.topbar h1{font-family:'Amiri',serif;font-size:20px;margin-bottom:2px;line-height:1.2;}
.topbar .sub{font-size:12px;opacity:.9;}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;}
.topbar .actions a{
  color:#fff;text-decoration:none;font-size:13px;padding:8px 16px;
  border-radius:20px;background:rgba(255,255,255,.15);transition:.3s;
  display:inline-flex;align-items:center;gap:6px;
}
.topbar .actions a:hover{background:rgba(255,255,255,.25);}
.topbar .actions a.primary{background:var(--emas);color:var(--hijau-tua);font-weight:600;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
.stat{
  background:#fff;border-radius:16px;padding:22px;
  box-shadow:0 4px 16px rgba(45,95,63,.08);
  border-left:4px solid var(--hijau);
  display:flex;align-items:center;gap:16px;
}
.stat .icon{font-size:36px;line-height:1;}
.stat .info .num{font-size:28px;font-weight:700;color:var(--hijau-tua);line-height:1;}
.stat .info .lbl{font-size:12px;color:#7a8a7d;margin-top:4px;}

.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 20px rgba(45,95,63,.08);margin-bottom:20px;}
.card h2{font-family:'Amiri',serif;color:var(--hijau-tua);font-size:20px;margin-bottom:16px;display:flex;align-items:center;gap:8px;}

/* Info Santri Aktif */
.santri-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;}
.santri-card{
  background:linear-gradient(135deg,#f0f7f1,#fff);
  border:2px solid var(--hijau-muda);
  border-radius:16px;padding:18px;position:relative;
  transition:.3s;
}
.santri-card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 20px rgba(45,95,63,.15);
  border-color:var(--hijau);
}
.santri-card::before{
  content:'🎓';position:absolute;top:12px;right:14px;
  font-size:22px;opacity:.35;
}
.santri-card h4{
  color:var(--hijau-tua);font-size:16px;margin-bottom:10px;
  padding-right:30px;
}
.santri-card .detail-row{
  display:flex;gap:8px;font-size:12px;padding:4px 0;
}
.santri-card .detail-row .label{
  color:#7a8a7d;min-width:60px;
}
.santri-card .detail-row .val{
  color:var(--hijau-tua);font-weight:600;flex:1;
}
.santri-card .badge-status{
  display:inline-block;margin-top:10px;padding:4px 12px;
  border-radius:20px;font-size:11px;font-weight:600;
  background:#e5f4ea;color:var(--hijau-tua);
}

.riwayat-item{
  border:2px solid #e0e6e1;border-radius:14px;padding:16px;
  margin-bottom:12px;transition:.3s;background:#fff;
}
.riwayat-item:hover{border-color:var(--hijau-muda);}
.riwayat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.riwayat-head h4{color:var(--hijau-tua);font-size:15px;}
.riwayat-head .kode{font-family:'Courier New',monospace;font-size:12px;color:#7a8a7d;}
.badge{
  display:inline-block;padding:4px 12px;border-radius:20px;
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;
}
.badge.menunggu-bayar{background:#fff8e1;color:#a67c00;}
.badge.menunggu-konfirmasi{background:#e7f3ff;color:#0056b3;}
.badge.terdaftar{background:#e5f4ea;color:var(--hijau-tua);}
.badge.batal{background:#fde8e8;color:#c0392b;}
.badge.kedaluwarsa{background:#f0f0f0;color:#888;}
.riwayat-detail{font-size:13px;color:#5a6b5d;display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.riwayat-detail .it span{color:#7a8a7d;font-size:12px;display:block;}
.riwayat-detail .it b{color:var(--hijau-tua);font-weight:600;}
.riwayat-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;}
.btn-sm{
  padding:8px 16px;border-radius:20px;font-size:12px;font-weight:600;
  text-decoration:none;border:none;cursor:pointer;transition:.3s;
  font-family:'Poppins',sans-serif;display:inline-flex;align-items:center;gap:6px;
}
.btn-sm.primary{background:var(--hijau);color:#fff;}
.btn-sm.primary:hover{background:var(--hijau-tua);}
.btn-sm.outline{background:transparent;border:2px solid var(--hijau-muda);color:var(--hijau-tua);}
.btn-sm.outline:hover{background:var(--krem);}
.btn-sm.danger{background:#fde8e8;color:#c0392b;}

.empty{
  text-align:center;padding:40px 20px;color:#999;
}
.empty .icon{font-size:60px;margin-bottom:12px;opacity:.5;}
.empty p{font-size:14px;margin-bottom:16px;}

.btn-primary{
  display:inline-block;padding:14px 28px;border-radius:30px;
  background:linear-gradient(135deg,var(--hijau-tua),var(--hijau));
  color:#fff;font-weight:600;font-size:14px;text-decoration:none;
  transition:.3s;border:none;cursor:pointer;font-family:'Poppins',sans-serif;
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(45,95,63,.3);}

.loading{text-align:center;padding:30px;color:#999;font-size:13px;}
.spinner{display:inline-block;width:20px;height:20px;border:3px solid var(--krem-tua);border-top-color:var(--hijau);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:600px){
  .riwayat-detail{grid-template-columns:1fr;}
  .topbar{padding:14px;}
  .topbar .brand-area img{height:40px;width:40px;}
  .topbar h1{font-size:16px;}
  .card{padding:18px;}
  .santri-grid{grid-template-columns:1fr;}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="brand-area">
      <img src="assets/logo.png" alt="Logo Les Alfadhl" 
           onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌿%3C/text%3E%3C/svg%3E'">
      <div>
        <h1>Ahlan wa Sahlan, <span id="namaUser">...</span></h1>
        <div class="sub">Dashboard Wali Santri • Les Alfadhl</div>
      </div>
    </div>

    <div class="actions">
      <a href="index.html" title="Beranda">🏠 Beranda</a>
      <a href="daftar.html" class="primary">+ Daftar Les</a>
      <a href="#" onclick="logout()">Logout</a>
    </div>
  </div>

  <!-- STATS: Aktif & Baru -->
  <div class="stats">
    <div class="stat">
      <div class="icon">🎓</div>
      <div class="info">
        <div class="num" id="statAktif">0</div>
        <div class="lbl">Santri Aktif Belajar</div>
      </div>
    </div>
    <div class="stat" style="border-left-color:#4a90e2;">
      <div class="icon">🆕</div>
      <div class="info">
        <div class="num" id="statBaru" style="color:#0056b3;">0</div>
        <div class="lbl">Santri Baru (Menunggu)</div>
      </div>
    </div>
  </div>

  <!-- INFO SANTRI AKTIF -->
  <div class="card" id="cardSantriAktif">
    <h2>🎓 Santri Aktif Belajar</h2>
    <div id="santriAktifContainer">
      <div class="loading"><div class="spinner"></div><br>Memuat...</div>
    </div>
  </div>

  <!-- RIWAYAT -->
  <div class="card">
    <h2>📋 Riwayat Pendaftaran</h2>
    <div id="riwayatContainer">
      <div class="loading"><div class="spinner"></div><br>Memuat...</div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbw2mayxghhXc8SX-AleROrdny8Yh75sKRol1lWbnrzVSaJ2B_yy1BAbqDzNHWc8xUoT/exec';
let user = null, token = null;

// ===== AUTH HELPER =====
function getAuth() {
  return {
    token: sessionStorage.getItem('token') || localStorage.getItem('token'),
    user: JSON.parse(sessionStorage.getItem('user') || localStorage.getItem('user') || 'null')
  };
}

function clearAuth() {
  localStorage.removeItem('token');
  localStorage.removeItem('user');
  sessionStorage.removeItem('token');
  sessionStorage.removeItem('user');
}

// ===== INIT =====
window.addEventListener('DOMContentLoaded', async () => {
  const auth = getAuth();
  user = auth.user;
  token = auth.token;
  
  if (!user || user.role !== 'wali') { 
    window.location.href = 'login.html'; 
    return; 
  }
  
  const ok = await verifySession();
  if (!ok) { 
    clearAuth();
    window.location.href = 'login.html'; 
    return; 
  }
  
  document.getElementById('namaUser').textContent = user.nama;
  await loadRiwayat();
});

async function verifySession() {
  try {
    const res = await fetch(API_URL, {
      method:'POST',
      body:JSON.stringify({ action:'verifySession', token }),
      headers:{'Content-Type':'text/plain;charset=utf-8'}
    });
    const r = await res.json();
    return r.success;
  } catch(e) { return false; }
}

function logout() {
  if (!confirm('Keluar dari akun?')) return;
  clearAuth();
  window.location.href = 'login.html';
}

// ===== LOAD RIWAYAT =====
async function loadRiwayat() {
  try {
    const res = await fetch(API_URL, {
      method:'POST',
      body:JSON.stringify({ action:'getRiwayat', token }),
      headers:{'Content-Type':'text/plain;charset=utf-8'}
    });
    const r = await res.json();
    if (!r.success) {
      if (r.message && (r.message.includes('Sesi habis') || r.message.includes('expired'))) {
        clearAuth(); 
        window.location.href='login.html'; 
        return;
      }
      document.getElementById('riwayatContainer').innerHTML = 
        '<div class="empty"><p>Gagal memuat: ' + r.message + '</p></div>';
      return;
    }
    renderRiwayat(r.data);
  } catch(e) {
    document.getElementById('riwayatContainer').innerHTML = 
      '<div class="empty"><p>Kesalahan: ' + e.message + '</p></div>';
  }
}

// ===== RENDER =====
function renderRiwayat(data) {
  const c = document.getElementById('riwayatContainer');
  const cs = document.getElementById('santriAktifContainer');
  
  if (!data || data.length === 0) {
    cs.innerHTML = '<div class="empty" style="padding:20px;"><p style="font-size:13px;">Belum ada santri aktif</p></div>';
    c.innerHTML = '<div class="empty"><div class="icon">🌿</div><p>Belum ada pendaftaran</p><a href="daftar.html" class="btn-primary">Daftar Les Sekarang</a></div>';
    document.getElementById('statAktif').textContent = 0;
    document.getElementById('statBaru').textContent = 0;
    return;
  }

  // Hitung stats
  let aktif = 0, baru = 0;
  data.forEach(d => {
    if (d.status === 'Terdaftar') aktif++;
    else if (d.status === 'Menunggu Pembayaran' || d.status === 'Menunggu Konfirmasi') baru++;
  });
  document.getElementById('statAktif').textContent = aktif;
  document.getElementById('statBaru').textContent = baru;

  // ===== RENDER SANTRI AKTIF =====
  const santriAktifList = data.filter(d => d.status === 'Terdaftar');
  if (santriAktifList.length === 0) {
    cs.innerHTML = '<div class="empty" style="padding:20px;"><div style="font-size:40px;opacity:.4;margin-bottom:8px;">🎓</div><p style="font-size:13px;">Belum ada santri aktif. Santri akan muncul di sini setelah pembayaran diverifikasi admin.</p></div>';
  } else {
    cs.innerHTML = '<div class="santri-grid">' + santriAktifList.map(d => `
      <div class="santri-card">
        <h4>👦 ${escapeHtml(d.namaSantri)}</h4>
        <div class="detail-row">
          <span class="label">Mapel</span>
          <span class="val">${escapeHtml(d.mapel || '-')}</span>
        </div>
        <div class="detail-row">
          <span class="label">Paket</span>
          <span class="val">${escapeHtml(d.paket || '-')}</span>
        </div>
        <div class="detail-row">
          <span class="label">Sesi</span>
          <span class="val">${escapeHtml(d.sesi || '-')}</span>
        </div>
        <span class="badge-status">✅ Aktif Belajar</span>
      </div>
    `).join('') + '</div>';
  }

  // ===== RENDER RIWAYAT =====
  c.innerHTML = data.map(d => {
    const badge = badgeClass(d.status);
    let actions = '';
    if (d.status === 'Menunggu Pembayaran') {
      actions = `<a href="pembayaran.html?kode=${encodeURIComponent(d.kode)}" class="btn-sm primary">💳 Lanjut Bayar</a>`;
    } else if (d.status === 'Menunggu Konfirmasi') {
      actions = `<span class="btn-sm outline">⏳ Menunggu verifikasi admin</span>`;
    } else if (d.status === 'Terdaftar') {
      actions = `<span class="btn-sm outline">🎉 Selamat belajar!</span>`;
    } else if (d.status === 'Batal' && d.catatanAdmin) {
      actions = `<span class="btn-sm danger">Alasan: ${escapeHtml(d.catatanAdmin)}</span>`;
    } else if (d.status === 'Kedaluwarsa') {
      actions = `<a href="daftar.html" class="btn-sm primary">🔄 Daftar Ulang</a>`;
    }
    return `
    <div class="riwayat-item">
      <div class="riwayat-head">
        <div>
          <h4>👦 ${escapeHtml(d.namaSantri)}</h4>
          <div class="kode">Kode: ${d.kode}</div>
        </div>
        <span class="badge ${badge}">${escapeHtml(d.status)}</span>
      </div>
      <div class="riwayat-detail">
        <div class="it"><span>Mapel</span><b>${escapeHtml(d.mapel || '-')}</b></div>
        <div class="it"><span>Paket</span><b>${escapeHtml(d.paket || '-')}</b></div>
        <div class="it"><span>Sesi</span><b>${escapeHtml(d.sesi || '-')}</b></div>
        <div class="it"><span>Total</span><b>Rp ${Number(d.jumlah || 0).toLocaleString('id-ID')}</b></div>
      </div>
      ${actions ? `<div class="riwayat-actions">${actions}</div>` : ''}
    </div>`;
  }).join('');
}

function badgeClass(s) {
  if (s === 'Menunggu Pembayaran') return 'menunggu-bayar';
  if (s === 'Menunggu Konfirmasi') return 'menunggu-konfirmasi';
  if (s === 'Terdaftar') return 'terdaftar';
  if (s === 'Batal') return 'batal';
  if (s === 'Kedaluwarsa') return 'kedaluwarsa';
  return '';
}

function escapeHtml(t) {
  if (!t) return '';
  return String(t).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
</script>

</body>
</html>
